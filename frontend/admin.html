<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Dashboard - Paper Trail Books</title>
        <link rel="stylesheet" href="style.css">
        <script src="app.js" defer></script>
    </head>

    <body>

        <header>
            <h1>Paper Trail Books</h1>
            <p>Administrator Dashboard</p>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html">Books</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>

        <main>
            <div id="adminPage">

                <!-- Admin content here -->            
                <section class="admin-container">

                    <h2>Book Management</h2>

                    <form id="addBookForm">

                        <input
                            type="text"
                            id="title"
                            placeholder="Book Title"
                            required>

                        <input
                            type="text"
                            id="author"
                            placeholder="Author"
                            required>

                        <input
                            type="text"
                            id="category"
                            placeholder="Category"
                            required>

                        <input
                            type="number"
                            id="price"
                            placeholder="Price"
                            step="0.01"
                            required>

                        <button id="addBookBtn" type="submit">
                            Add Book
                        </button>

                    </form>

                    <table>

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Author</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="adminBooksTable">

                        </tbody>

                    </table>

                </section>
            </div>

        </main>

    </body>
</html>
