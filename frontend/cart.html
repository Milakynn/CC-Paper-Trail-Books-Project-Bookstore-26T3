<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shopping Cart - Paper Trail Books</title>
        <link rel="stylesheet" href="style.css">
        <script src="app.js" defer></script>
    </head>

    <body>

        <header>
            <h1>Paper Trail Books</h1>
            <p>Your Shopping Cart</p>
        </header>

        <main>

            <section class="cart-container">

                <h2>Cart Items</h2>

                <table>

                    <thead>
                        <tr>
                            <th>Book</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>The Great Gatsby</td>
                            <td>$19.99</td>
                            <td>1</td>
                            <td>$19.99</td>
                        </tr>

                        <tr>
                            <td>1984</td>
                            <td>$22.99</td>
                            <td>2</td>
                            <td>$45.98</td>
                        </tr>

                    </tbody>

                </table>

                <div class="cart-summary">

                    <h3>Order Summary</h3>

                    <p><strong>Total:</strong> $65.97</p>

                    <button id="checkoutBtn">
                        Proceed to Checkout
                    </button>

                </div>

            </section>

        </main>

    </body>
</html>
