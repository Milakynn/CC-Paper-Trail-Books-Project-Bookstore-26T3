<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Book Details - Paper Trail Books</title>
        <link rel="stylesheet" href="style.css">
        <script src="app.js" defer></script>
    </head>

    <body>

        <header>
            <h1>Paper Trail Books</h1>
            <p>Book Information</p>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html">Books</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>

        <main>

            <section class="details-container" id="bookDetails">

                <div class="book-image">
                    <img src="https://placehold.co/250x350?text=Book+Cover" alt="Book Cover">
                </div>

                <div class="book-info">

                    <h2 id="detailTitle">Loading...</h2>

                    <p><strong>Author:</strong> <span id="detailAuthor"></span></p>

                    <p><strong>Category:</strong> <span id="detailCategory"></span></p>

                    <p><strong>Price:</strong> <span id="detailPrice"></span></p>

                    <p><strong>Stock:</strong> <span id="detailStock"></span></p>

                    <p>
                        <strong>Description:</strong>
                        <span id="detailDescription"></span>
                    </p>

                    <button id="addToCartBtn">
                        Add to Cart
                    </button>

                </div>

            </section>

        </main>

    </body>
</html>
