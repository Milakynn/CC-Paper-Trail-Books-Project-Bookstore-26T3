<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Profile - Paper Trail Books</title>
        <link rel="stylesheet" href="style.css">
        <script src="app.js" defer></script>
    </head>

    <body>

        <header>
            <h1>Paper Trail Books</h1>
            <p>Customer Profile</p>
        </header>

        <main>

            <section class="profile-container">

                <h2>My Account</h2>

                <div class="profile-card">

                    <p><strong>Name:</strong> John Smith</p>

                    <p><strong>Email:</strong> johnsmith@email.com</p>

                    <p><strong>Member Since:</strong> November 2026</p>

                    <button id="editProfileBtn">
                        Edit Profile
                    </button>

                </div>

            </section>

            <section class="orders-container">

                <h2>Order History</h2>

                <table>

                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Date</th>
                            <th>Total</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>1001</td>
                            <td>15/11/2026</td>
                            <td>$39.98</td>
                        </tr>

                        <tr>
                            <td>1002</td>
                            <td>18/11/2026</td>
                            <td>$22.99</td>
                        </tr>

                    </tbody>

                </table>

            </section>

        </main>

    </body>
</html>
