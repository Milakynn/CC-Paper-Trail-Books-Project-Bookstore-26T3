<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login - Paper Trail Bookstore</title>
        <link rel="stylesheet" href="style.css">
        <script src="app.js" defer></script>
    </head>

    <body>
        <header>
            <h1>Paper Trail Books</h1>
            <p>Customer Login</p>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html">Books</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>

        <main>
            <section class="form-container">

                <h2>Sign in</h2>

                <form id="loginForm">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="customer@gmail.com">

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Customer1">

                    <button type="submit">
                        Sign in
                    </button>

                </form>
                <br/>
                <p>
                    Don't have an account?
                    <a href="register.html">Sign up here</a>
                </p>

            </section>
        </main>
    </body>
</html>
