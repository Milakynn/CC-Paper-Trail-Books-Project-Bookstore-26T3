<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - Paper Trail Books</title>
        <link rel="stylesheet" href="style.css">
        <script src="app.js" defer></script>
    </head>

    <body>

        <header>
            <h1>Paper Trail Books</h1>
            <p>Create Your Customer Account</p>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html">Books</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>

        <main>

            <section class="form-container">

                <h2>Sign up</h2>

                <form id="registerForm">

                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required placeholder="Linday Kuilagi">

                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="lindsay@gmail.com">

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your passwords">

                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Enter the same password">

                    <button type="submit">
                        Sign up
                    </button>

                </form>
                <br/>
                <p>
                    Already have an account?
                    <a href="login.html">Sign in here</a>
                </p>

            </section>

        </main>

    </body>
</html>
